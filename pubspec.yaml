name: mochi_moon
description: "Mochi Moon: self-love and zodiac."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  astronomia: ^1.1.1
  cloud_firestore: ^7.1.0
  dio: ^5.11.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_card_swiper: ^7.2.0
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.1.1
  google_sign_in: ^7.2.0
  home_widget: ^0.10.0
  in_app_purchase: ^3.3.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  lat_lng_to_timezone: ^0.2.0
  lottie: ^3.6.1
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/quotes/
    - assets/content/signs/
    - assets/content/fallback_readings/
    - assets/content/cities/
    - assets/illustrations/
    - assets/lottie/
